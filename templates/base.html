<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Attendance{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-layout">
  
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🎓</div>
      <div class="sidebar-logo-text">AttendAI</div>
    </div>

    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard" class="nav-item">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a href="/students" class="nav-item">
      <span class="nav-icon">👥</span> Students
    </a>
    <a href="/courses" class="nav-item">
      <span class="nav-icon">📖</span> Courses
    </a>
    <a href="/attendance" class="nav-item">
      <span class="nav-icon">📷</span> Take Attendance
    </a>

    <div class="sidebar-section-label">Analytics</div>
    <a href="/reports" class="nav-item">
      <span class="nav-icon">📋</span> Reports
    </a>

    <div class="sidebar-footer">
      <div class="faculty-badge">
        <div class="faculty-avatar">{{ faculty_name[0] | upper }}</div>
        <div>
          <div class="faculty-name">{{ faculty_name }}</div>
          <div class="faculty-role">Faculty</div>
        </div>
      </div>
      <a href="/logout" class="nav-item" style="color:var(--danger);">
        <span class="nav-icon">🚪</span> Logout
      </a>
    </div>
  </aside>

  
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>
</div>

<div id="toastContainer" class="toast-container"></div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
